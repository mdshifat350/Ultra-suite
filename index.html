<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ultra Suite · Ultimate Workspace</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            colors: { ultra: { 50:'#f0f4ff',100:'#e0e9ff',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#1e1b4b',900:'#0f172a',dark:'#090d16' } },
            fontFamily: { sans:['Inter','sans-serif'], heading:['Outfit','sans-serif'] }
        }
    }
}
</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:#070a12;color:#f3f4f6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.light-mode{background:#f1f5f9;color:#0f172a}
body.light-mode .glass-panel{background:rgba(255,255,255,0.85);border-color:rgba(0,0,0,0.08)}
body.light-mode .glass-card{background:rgba(255,255,255,0.7);border-color:rgba(0,0,0,0.06)}
body.light-mode .text-slate-300,body.light-mode .text-slate-400{color:#475569!important}
body.light-mode .text-white{color:#0f172a!important}
body.light-mode input,body.light-mode textarea,body.light-mode select{background:#fff!important;color:#0f172a!important;border-color:#cbd5e1!important}
.glass-panel{background:rgba(15,23,42,0.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.08)}
.glass-card{background:rgba(30,41,59,0.5);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);transition:all 0.25s cubic-bezier(0.4,0,0.2,1)}
.glass-card:hover{border-color:rgba(99,102,241,0.4);transform:translateY(-2px);box-shadow:0 10px 25px -5px rgba(99,102,241,0.2)}
.active-nav-item{background:linear-gradient(90deg,rgba(99,102,241,0.25) 0%,rgba(168,85,247,0.1) 100%);border-left:4px solid #6366f1;color:#ffffff!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:rgba(15,23,42,0.6)}
::-webkit-scrollbar-thumb{background:rgba(99,102,241,0.3);border-radius:999px}
.animated-gradient-bg{background:linear-gradient(-45deg,#090d16,#111827,#1e1b4b,#0f172a);background-size:400% 400%;animation:gradient 15s ease infinite}
@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
body.light-mode.animated-gradient-bg{background:linear-gradient(-45deg,#e2e8f0,#f1f5f9,#dbeafe,#f8fafc)}
.tool-link-card{cursor:pointer}
.tool-link-card .tool-icon{transition:transform 0.2s ease,filter 0.2s ease}
.tool-link-card:hover .tool-icon{transform:scale(1.1);filter:drop-shadow(0 0 8px currentColor)}
.code-editor{font-family:'Courier New',monospace;tab-size:2;line-height:1.5}
.login-fade-out{animation:fadeOut 0.5s ease forwards}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
@keyframes adminPulse{0%,100%{box-shadow:0 0 0 0 rgba(236,72,153,0.7)}50%{box-shadow:0 0 0 8px rgba(236,72,153,0)}}
.admin-pulse{animation:adminPulse 2s infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:0.4}}
.live-pulse{animation:livePulse 1.5s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.timer-circle{transform:rotate(-90deg);transition:stroke-dashoffset 1s linear}
.sound-on{color:#10b981}
.sound-off{color:#ef4444}
.notif-dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;background:#ef4444;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:bold;border:2px solid #0f172a;padding:0 4px}
.chat-messages::-webkit-scrollbar{width:4px}
.chat-messages::-webkit-scrollbar-thumb{background:rgba(99,102,241,0.4);border-radius:999px}
.msg-bubble{max-width:75%;padding:8px 14px;border-radius:18px;word-wrap:break-word;font-size:14px;line-height:1.4;position:relative}
.msg-bubble.me{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-bottom-right-radius:4px;margin-left:auto}
.msg-bubble.other{background:rgba(30,41,59,0.9);border:1px solid rgba(255,255,255,0.08);color:#f3f4f6;border-bottom-left-radius:4px}
.msg-time{font-size:10px;opacity:0.7;margin-top:3px;text-align:right}
@media(min-width:768px){
#view-messages{display:flex!important;gap:16px;height:calc(100vh-140px)}
#messagesListView{display:flex!important;width:340px;flex-shrink:0;flex-direction:column;height:100%}
#chatView{flex:1;height:100%}
#chatView.hidden{display:none!important}
}
@media(max-width:767px){
#messagesListView.hidden-mobile{display:none!important}
#chatView.hidden{display:none!important}
}
#chatMessages::-webkit-scrollbar{width:6px}
.piano-key{transition:all 0.1s;cursor:pointer;user-select:none}
.piano-key:active,.piano-key.playing{background:#6366f1!important;transform:translateY(2px)}
.drum-pad{transition:all 0.1s;cursor:pointer;user-select:none}
.drum-pad:active,.drum-pad.playing{transform:scale(0.95);background:#6366f1!important;box-shadow:0 0 20px #6366f1}
.sudoku-cell{border:1px solid rgba(99,102,241,0.3);text-align:center;font-size:18px;background:rgba(15,23,42,0.5);color:#fff;font-weight:600}
.sudoku-cell:focus{outline:2px solid #6366f1;background:rgba(99,102,241,0.15)}
.sudoku-cell.fixed{background:rgba(99,102,241,0.15);color:#a5b4fc}
.sudoku-cell.err{color:#ef4444}
.g2048-cell{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;border-radius:8px;transition:all 0.15s}
</style>
</head>
<body class="animated-gradient-bg min-h-screen text-slate-100 flex flex-col antialiased">

<div id="toastContainer" class="fixed top-5 right-5 z-[200] flex flex-col gap-2 pointer-events-none"></div>
<div id="mobileBackdrop" onclick="closeSidebar()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-30 hidden lg:hidden"></div>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-950 overflow-y-auto">
<div class="absolute inset-0 overflow-hidden pointer-events-none">
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
<div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-pink-600/20 rounded-full blur-3xl"></div>
</div>
<div class="relative glass-card rounded-3xl p-8 w-full max-w-md border border-indigo-500/30 shadow-2xl my-8">
<div class="text-center mb-6">
<div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/40 mb-4">
<i class="fa-solid fa-bolt text-white text-2xl"></i>
</div>
<h1 class="font-heading font-extrabold text-3xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">ULTRA<span class="text-indigo-400">SUITE</span></h1>
<p class="text-slate-400 text-sm mt-2" id="loginSubtitle">Sign in to continue</p>
</div>
<div class="flex gap-2 mb-6 bg-slate-900/60 rounded-xl p-1">
<button onclick="switchAuthTab('login')" id="authTab-login" class="flex-1 py-2 rounded-lg text-xs font-semibold transition bg-indigo-600 text-white"><i class="fa-solid fa-right-to-bracket mr-1"></i> Login</button>
<button onclick="switchAuthTab('signup')" id="authTab-signup" class="flex-1 py-2 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-white"><i class="fa-solid fa-user-plus mr-1"></i> Sign Up</button>
</div>
<div class="space-y-4">
<div>
<label class="text-xs font-semibold text-slate-300 flex items-center gap-2 mb-2"><i class="fa-solid fa-user text-indigo-400"></i><span>Username</span></label>
<input type="text" id="loginUsername" placeholder="Enter username..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
</div>
<div>
<label class="text-xs font-semibold text-slate-300 flex items-center gap-2 mb-2"><i class="fa-solid fa-lock text-indigo-400"></i><span>Password</span></label>
<div class="relative">
<input type="password" id="loginPassword" placeholder="Enter password..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 pr-12">
<button onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white p-1"><i id="eyeIcon" class="fa-solid fa-eye text-sm"></i></button>
</div>
</div>
<button onclick="handleAuth()" id="authSubmitBtn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold text-sm shadow-lg shadow-indigo-500/30 transition flex items-center justify-center gap-2">
<i class="fa-solid fa-right-to-bracket"></i><span id="authSubmitText">Login</span>
</button>
<p id="loginError" class="text-xs text-red-400 text-center hidden"><i class="fa-solid fa-circle-exclamation mr-1"></i><span id="loginErrorText"></span></p>
<p id="loginSuccess" class="text-xs text-emerald-400 text-center hidden"><i class="fa-solid fa-circle-check mr-1"></i><span id="loginSuccessText"></span></p>
</div>
</div>
</div>

<!-- PROFILE SETUP MODAL -->
<div id="profileSetupModal" class="fixed inset-0 bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-950 z-[95] hidden flex items-center justify-center p-4 overflow-y-auto">
<div class="glass-card rounded-3xl p-8 w-full max-w-md border border-indigo-500/30 shadow-2xl my-8">
<div class="text-center mb-6">
<div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center shadow-lg mb-4">
<i class="fa-solid fa-user-plus text-white text-2xl"></i>
</div>
<h2 class="font-heading font-extrabold text-2xl text-white">Setup Your Profile</h2>
<p class="text-slate-400 text-sm mt-2">Add a photo and display name</p>
</div>
<div class="text-center mb-6">
<div class="relative w-28 h-28 mx-auto">
<div class="w-28 h-28 rounded-full bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white text-5xl font-bold overflow-hidden border-4 border-slate-800 shadow-xl" id="setupAvatarDisplay">
<span id="setupAvatarLetter">?</span>
</div>
<label for="setupAvatarInput" class="absolute bottom-0 right-0 w-10 h-10 rounded-full bg-gradient-to-tr from-pink-600 to-purple-600 flex items-center justify-center cursor-pointer shadow-lg border-4 border-slate-900 hover:scale-110 transition">
<i class="fa-solid fa-camera text-white text-sm"></i>
</label>
<input type="file" id="setupAvatarInput" accept="image/*" class="hidden" onchange="handleSetupAvatar(event)">
</div>
<p class="text-xs text-slate-400 mt-3">Tap camera to add photo</p>
</div>
<div class="space-y-4">
<div>
<label class="text-xs font-semibold text-slate-300 flex items-center gap-2 mb-2"><i class="fa-solid fa-user text-indigo-400"></i><span>Display Name</span></label>
<input type="text" id="setupDisplayName" placeholder="Your name..." maxlength="30" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500">
</div>
<div>
<label class="text-xs font-semibold text-slate-300 flex items-center gap-2 mb-2"><i class="fa-solid fa-circle-info text-indigo-400"></i><span>Bio (optional)</span></label>
<input type="text" id="setupBio" placeholder="Write something..." maxlength="80" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500">
</div>
<div class="bg-indigo-500/10 border border-indigo-500/30 rounded-xl p-3">
<p class="text-xs text-indigo-300 flex items-center gap-2"><i class="fa-solid fa-info-circle"></i><span>Username: <b id="setupUsernameDisplay">-</b></span></p>
</div>
<button onclick="completeSignup()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold text-sm shadow-lg transition flex items-center justify-center gap-2">
<i class="fa-solid fa-check-circle"></i><span>Complete Sign Up</span>
</button>
<button onclick="cancelSignup()" class="w-full py-3 rounded-xl glass-card text-slate-400 text-xs hover:text-white transition">Cancel</button>
</div>
</div>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="hidden min-h-screen flex flex-col">
<header class="sticky top-0 z-40 w-full glass-panel border-b border-slate-800/80 px-4 py-3 flex items-center justify-between">
<div class="flex items-center gap-3">
<button onclick="toggleSidebar()" class="p-2.5 text-slate-300 hover:text-white hover:bg-slate-800/80 rounded-xl transition lg:hidden"><i class="fa-solid fa-bars text-xl"></i></button>
<div class="flex items-center gap-2.5">
<div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/30"><i class="fa-solid fa-bolt text-white text-lg"></i></div>
<h1 class="font-heading font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">ULTRA<span class="text-indigo-400">SUITE</span></h1>
</div>
</div>
<div class="flex items-center gap-2">
<button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-800/60 hover:bg-slate-700 text-slate-300 transition"><i class="fa-solid fa-moon text-sm" id="themeIcon"></i></button>
<button onclick="toggleSound()" class="p-2 rounded-lg bg-slate-800/60 hover:bg-slate-700 transition"><i class="fa-solid fa-volume-high text-sm sound-on" id="soundIcon"></i></button>
<button onclick="toggleNotifications()" class="relative p-2 rounded-lg bg-slate-800/60 hover:bg-slate-700 text-slate-300 transition">
<i class="fa-solid fa-bell text-sm" id="bellIcon"></i>
<span id="notifBadge" class="notif-dot hidden">0</span>
</button>
<button onclick="openProfileModal()" class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800/60 hover:bg-slate-700 border border-slate-700 transition cursor-pointer">
<div class="w-6 h-6 rounded-full bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white text-[10px] font-bold overflow-hidden" id="userAvatar">U</div>
<span class="text-xs font-semibold text-slate-200" id="currentUserHeader">User</span>
</button>
<button onclick="promptAdminPassword()" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-gradient-to-r from-pink-600/30 to-purple-600/30 hover:from-pink-600/50 hover:to-purple-600/50 border border-pink-500/50 text-xs font-bold text-pink-200 transition admin-pulse">
<i class="fa-solid fa-crown text-pink-300"></i><span class="hidden sm:inline">Admin</span>
</button>
<button onclick="handleLogout()" class="p-2 text-slate-400 hover:text-red-400 hover:bg-red-500/10 rounded-lg transition"><i class="fa-solid fa-right-from-bracket text-sm"></i></button>
</div>
</header>

<div id="notificationsPanel" class="fixed top-16 right-4 w-80 glass-card rounded-2xl border border-slate-700 z-50 hidden max-h-96 overflow-y-auto">
<div class="p-3 border-b border-slate-700 flex items-center justify-between sticky top-0 bg-slate-900/90 backdrop-blur">
<span class="font-bold text-sm text-white">🔔 Notifications</span>
<button onclick="clearNotifications()" class="text-xs text-red-400 hover:text-red-300">Clear</button>
</div>
<div id="notificationsList" class="p-2 space-y-2"></div>
</div>

<div class="flex flex-1 relative overflow-hidden">
<aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-72 glass-panel border-r border-slate-800/80 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-300 h-[calc(100vh-61px)] top-[61px]">
<div class="p-4 border-b border-slate-800/60 flex items-center justify-between">
<span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Navigation</span>
<button onclick="closeSidebar()" class="lg:hidden text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
</div>
<nav class="flex-1 overflow-y-auto p-3 space-y-1" id="sidebarNav"></nav>
<div class="p-3 border-t border-slate-800/80 bg-slate-900/40">
<div class="glass-card p-3 rounded-xl text-xs space-y-2">
<div class="flex items-center gap-2 text-slate-300 font-semibold"><span class="w-2 h-2 rounded-full bg-emerald-400 live-pulse"></span><span>Online</span></div>
<p class="text-[11px] text-slate-400" id="sidebarUserInfo">Loading...</p>
</div>
</div>
</aside>

<main class="flex-1 overflow-y-auto p-4 lg:p-6 h-[calc(100vh-61px)]">
<div id="viewsContainer"></div>
</main>
</div>
</div>

<!-- MODALS -->
<div id="profileModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[85] hidden flex items-center justify-center p-4">
<div class="glass-card w-full max-w-md p-6 rounded-2xl border border-indigo-500/30 space-y-4 max-h-[90vh] overflow-y-auto">
<div class="flex justify-between items-center"><h3 class="font-heading font-bold text-lg text-white">Edit Profile</h3><button onclick="closeProfileModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button></div>
<div class="text-center">
<div class="w-24 h-24 mx-auto rounded-full bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white text-4xl font-bold overflow-hidden relative" id="profileAvatarDisplay"><span id="profileAvatarLetter">U</span></div>
<input type="file" id="avatarUpload" accept="image/*" class="hidden" onchange="uploadAvatar(event)">
<button onclick="document.getElementById('avatarUpload').click()" class="mt-3 text-xs text-indigo-400 hover:text-indigo-300"><i class="fa-solid fa-camera mr-1"></i> Change Photo</button>
</div>
<input type="text" id="profileDisplayName" placeholder="Display name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
<input type="text" id="profileBio" placeholder="Bio..." maxlength="80" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
<input type="password" id="profileNewPassword" placeholder="New password (blank = keep)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
<div class="flex gap-2">
<button onclick="closeProfileModal()" class="flex-1 py-2 rounded-xl glass-card text-xs text-slate-300">Cancel</button>
<button onclick="saveProfile()" class="flex-1 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold">Save</button>
</div>
</div>
</div>

<div id="addAppModal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
<div class="glass-card w-full max-w-md p-6 rounded-2xl border border-cyan-500/30 space-y-4">
<div class="flex justify-between items-center"><h3 class="font-heading font-bold text-lg text-white">Add Custom App</h3><button onclick="closeAddAppModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button></div>
<input type="text" id="newAppName" placeholder="App Name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200">
<input type="url" id="newAppUrl" placeholder="https://example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-cyan-300 font-mono">
<div class="flex justify-end gap-2">
<button onclick="closeAddAppModal()" class="px-4 py-2 rounded-xl glass-card text-xs text-slate-300">Cancel</button>
<button onclick="saveNewCustomApp()" class="px-4 py-2 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold">Add</button>
</div>
</div>
</div>

<div id="adminPasswordModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[90] hidden flex items-center justify-center p-4">
<div class="glass-card w-full max-w-md p-6 rounded-2xl border-2 border-pink-500/50 space-y-4">
<div class="text-center">
<div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-pink-600 to-purple-600 flex items-center justify-center shadow-lg admin-pulse mb-3"><i class="fa-solid fa-crown text-white text-2xl"></i></div>
<h3 class="font-heading font-bold text-xl text-white">Admin Access</h3>
</div>
<input type="password" id="adminPasswordInput" placeholder="Enter admin password..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-pink-500">
<p id="adminPasswordError" class="text-xs text-red-400 text-center hidden">ভুল পাসওয়ার্ড!</p>
<div class="flex gap-2">
<button onclick="closeAdminPasswordModal()" class="flex-1 py-2.5 rounded-xl glass-card text-xs text-slate-300 font-semibold">Cancel</button>
<button onclick="verifyAdminPassword()" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-pink-600 to-purple-600 text-white text-xs font-bold"><i class="fa-solid fa-unlock mr-1"></i> Unlock</button>
</div>
</div>
</div>

<div id="adminPanel" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[80] hidden overflow-y-auto p-4">
<div class="max-w-6xl mx-auto my-6" id="adminPanelContent"></div>
</div>

<script src="part2.js"></script>
<script src="part3.js"></script>
</body>
  </html>
