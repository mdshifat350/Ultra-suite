::-webkit-scrollbar{width:6px;height:6px}

::-webkit-scrollbar-thumb{background:rgba(99,102,241,0.3);border-radius:999px}

.code-editor{font-family:'Courier New',monospace;tab-size:2;line-height:1.5}
.login-fade-out{animation:fadeOut 0.5s ease forwards}

@keyframes livePulse{0%,100%{opacity:1}50%{opacity:0.4}}

@keyframes spin{to{transform:rotate(360deg)}}
.timer-circle{transform:rotate(-90deg);transition:stroke-dashoffset 1s linear}
.sound-on{color:#10b981}
.sound-off{color:#ef4444}
.notif-dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;background:#ef4444;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:bold;border:2px solid #0f172a;padding:0 4px}

.msg-bubble.me{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-bottom-right-radius:4px;margin-left:auto}

.piano-key{transition:all 0.1s;cursor:pointer;user-select:none}

/* ==================== PREMIUM LOGIN DESIGN ==================== */
#loginScreen {
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    position: relative;
    overflow: hidden;
}

#loginScreen::before {
    content: '';
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.4) 0%, transparent 70%);
    top: -200px;
    left: -200px;
    animation: float1 15s ease-in-out infinite;
}

#loginScreen::after {
    content: '';
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(236, 72, 153, 0.3) 0%, transparent 70%);
    bottom: -150px;
    right: -150px;
    animation: float2 18s ease-in-out infinite;
}

@keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(80px, 60px) scale(1.2); }
}

@keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-80px, -60px) scale(1.3); }
}

#loginScreen > div.relative {
    background: rgba(15, 12, 41, 0.75) !important;
    backdrop-filter: blur(30px) !important;
    -webkit-backdrop-filter: blur(30px) !important;
    border: 1px solid rgba(139, 92, 246, 0.4) !important;
    box-shadow: 
        0 25px 70px rgba(0, 0, 0, 0.6),
        0 0 100px rgba(139, 92, 246, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.1) !important;
    position: relative;
    z-index: 10;
}

#loginScreen .w-16.h-16 {
    animation: pulse 3s ease-in-out infinite;
    box-shadow: 
        0 0 40px rgba(139, 92, 246, 0.8),
        0 0 80px rgba(139, 92, 246, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.3) !important;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(139, 92, 246, 0.8), 0 0 80px rgba(139, 92, 246, 0.4); }
    50% { transform: scale(1.08); box-shadow: 0 0 60px rgba(139, 92, 246, 1), 0 0 120px rgba(139, 92, 246, 0.6); }
}

#loginScreen h1 {
    background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 50%, #ec4899 100%) !important;
    -webkit-background-clip: text !important;
    background-clip: text !important;
    color: transparent !important;
    text-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
}

#loginScreen input {
    background: rgba(15, 12, 41, 0.6) !important;
    border: 1px solid rgba(139, 92, 246, 0.3) !important;
    transition: all 0.3s ease !important;
    color: #fff !important;
}

#loginScreen input::placeholder {
    color: rgba(165, 180, 252, 0.5) !important;
}

#loginScreen input:focus {
    border-color: #8b5cf6 !important;
    box-shadow: 
        0 0 0 3px rgba(139, 92, 246, 0.2),
        0 0 30px rgba(139, 92, 246, 0.4) !important;
    background: rgba(15, 12, 41, 0.9) !important;
}

#authSubmitBtn {
    background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%) !important;
    box-shadow: 
        0 10px 30px rgba(139, 92, 246, 0.4),
        0 0 40px rgba(236, 72, 153, 0.3) !important;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease !important;
}

#authSubmitBtn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.5s;
}

#authSubmitBtn:hover::before {
    left: 100%;
}

#authSubmitBtn:hover {
    transform: translateY(-2px);
    box-shadow: 
        0 15px 40px rgba(139, 92, 246, 0.6),
        0 0 60px rgba(236, 72, 153, 0.5) !important;
}

.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
}

.divider::before,
.divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.5), transparent);
}

.divider span {
    color: rgba(165, 180, 252, 0.7);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
}

.social-login {
    display: flex;
    gap: 10px;
    margin-top: 4px;
}

.social-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 16px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    backdrop-filter: blur(10px);
}

.social-btn:hover {
    transform: translateY(-3px);
    border-color: rgba(255, 255, 255, 0.3);
}

.social-btn.google {
    background: linear-gradient(135deg, rgba(234, 67, 53, 0.15), rgba(66, 133, 244, 0.15));
    border-color: rgba(66, 133, 244, 0.4);
}

.social-btn.google:hover {
    background: linear-gradient(135deg, rgba(234, 67, 53, 0.3), rgba(66, 133, 244, 0.3));
    box-shadow: 0 10px 30px rgba(66, 133, 244, 0.4);
}

.social-btn svg {
    width: 20px;
    height: 20px;
}

#authTab-login, #authTab-signup {
    transition: all 0.3s ease !important;
}

#authTab-login.bg-indigo-600,
#authTab-signup.bg-indigo-600 {
    background: linear-gradient(135deg, #8b5cf6, #ec4899) !important;
    box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
}

@keyframes slideIn {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

#loginScreen > div.relative {
    animation: slideIn 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}
</style>
</head>

<div class="flex items-center gap-2.5">
<div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/30"><i class="fa-solid fa-bolt text-white text-lg"></i></div>
<h1 class="font-heading font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">ULTRA<span class="text-indigo-400">SUITE</span></h1>
</div>
</div>
<div class="flex items-center gap-2">
<button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-800/60 hover:bg-slate-700 text-slate-300 transition"><i class="fa-solid fa-moon text-sm" id="themeIcon"></i></button>
<button onclick="toggleSound()" class="p-2 rounded-lg bg-slate-800/60 hover:bg-slate-700 transition"><i class="fa-solid fa-volume-high text-sm sound-on" id="soundIcon"></i></button>
<button onclick="toggleNotifications()" class="relative p-2 rounded-lg bg-slate-800/60 hover:bg-slate-700 text-slate-300 transition">
<i class="fa-solid fa-bell text-sm" id="bellIcon"></i>
<span id="notifBadge" class="notif-dot hidden">0</span>
</button>
<button onclick="openProfileModal()" class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800/60 hover:bg-slate-700 border border-slate-700 transition cursor-pointer">
<div class="w-6 h-6 rounded-full bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white text-[10px] font-bold overflow-hidden" id="userAvatar">U</div>
<span class="text-xs font-semibold text-slate-200" id="currentUserHeader">User</span>
</button>
<button onclick="promptAdminPassword()" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-gradient-to-r from-pink-600/30 to-purple-600/30 hover:from-pink-600/50 hover:to-purple-600/50 border border-pink-500/50 text-xs font-bold text-pink-200 transition admin-pulse">
<i class="fa-solid fa-crown text-pink-300"></i><span class="hidden sm:inline">Admin</span>
</button>
<button onclick="handleLogout()" class="p-2 text-slate-400 hover:text-red-400 hover:bg-red-500/10 rounded-lg transition"><i class="fa-solid fa-right-from-bracket text-sm"></i></button>
</div>
</header>

<div id="notificationsPanel" class="fixed top-16 right-4 w-80 glass-card rounded-2xl border border-slate-700 z-50 hidden max-h-96 overflow-y-auto">
<div class="p-3 border-b border-slate-700 flex items-center justify-between sticky top-0 bg-slate-900/90 backdrop-blur">
<span class="font-bold text-sm text-white">🔔 Notifications</span>
<button onclick="clearNotifications()" class="text-xs text-red-400 hover:text-red-300">Clear</button>
</div>
<div id="notificationsList" class="p-2 space-y-2"></div>
</div>

<div class="flex flex-1 relative overflow-hidden">
<aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-72 glass-panel border-r border-slate-800/80 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-300 h-[calc(100vh-61px)] top-[61px]">
<div class="p-4 border-b border-slate-800/60 flex items-center justify-between">
<span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Navigation</span>
<button onclick="closeSidebar()" class="lg:hidden text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
</div>
<nav class="flex-1 overflow-y-auto p-3 space-y-1" id="sidebarNav"></nav>
<div class="p-3 border-t border-slate-800/80 bg-slate-900/40">
<div class="glass-card p-3 rounded-xl text-xs space-y-2">
<div class="flex items-center gap-2 text-slate-300 font-semibold"><span class="w-2 h-2 rounded-full bg-emerald-400 live-pulse"></span><span>Online</span></div>
<p class="text-[11px] text-slate-400" id="sidebarUserInfo">Loading...</p>
</div>
</div>
</aside>

<main class="flex-1 overflow-y-auto p-4 lg:p-6 h-[calc(100vh-61px)]">
<div id="viewsContainer"></div>
</main>
</div>
</div>

<!-- MODALS -->
<div id="profileModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[85] hidden flex items-center justify-center p-4">
<div class="glass-card w-full max-w-md p-6 rounded-2xl border border-indigo-500/30 space-y-4 max-h-[90vh] overflow-y-auto">
<div class="flex justify-between items-center"><h3 class="font-heading font-bold text-lg text-white">Edit Profile</h3><button onclick="closeProfileModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button></div>
<div class="text-center">
<div class="w-24 h-24 mx-auto rounded-full bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white text-4xl font-bold overflow-hidden relative" id="profileAvatarDisplay"><span id="profileAvatarLetter">U</span></div>
<input type="file" id="avatarUpload" accept="image/*" class="hidden" onchange="uploadAvatar(event)">
<button onclick="document.getElementById('avatarUpload').click()" class="mt-3 text-xs text-indigo-400 hover:text-indigo-300"><i class="fa-solid fa-camera mr-1"></i> Change Photo</button>
</div>
<input type="text" id="profileDisplayName" placeholder="Display name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
<input type="text" id="profileBio" placeholder="Bio..." maxlength="80" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
<input type="password" id="profileNewPassword" placeholder="New password (blank = keep)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
<div class="flex gap-2">
<button onclick="closeProfileModal()" class="flex-1 py-2 rounded-xl glass-card text-xs text-slate-300">Cancel</button>
<button onclick="saveProfile()" class="flex-1 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold">Save</button>
</div>
</div>
</div>

<div id="addAppModal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
<div class="glass-card w-full max-w-md p-6 rounded-2xl border border-cyan-500/30 space-y-4">
<div class="flex justify-between items-center"><h3 class="font-heading font-bold text-lg text-white">Add Custom App</h3><button onclick="closeAddAppModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button></div>
<input type="text" id="newAppName" placeholder="App Name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200">
<input type="url" id="newAppUrl" placeholder="https://example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-cyan-300 font-mono">
<div class="flex justify-end gap-2">
<button onclick="closeAddAppModal()" class="px-4 py-2 rounded-xl glass-card text-xs text-slate-300">Cancel</button>
<button onclick="saveNewCustomApp()" class="px-4 py-2 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold">Add</button>
</div>
</div>
</div>

<div id="adminPasswordModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[90] hidden flex items-center justify-center p-4">
<div class="glass-card w-full max-w-md p-6 rounded-2xl border-2 border-pink-500/50 space-y-4">
<div class="text-center">
<div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-pink-600 to-purple-600 flex items-center justify-center shadow-lg admin-pulse mb-3"><i class="fa-solid fa-crown text-white text-2xl"></i></div>
<h3 class="font-heading font-bold text-xl text-white">Admin Access</h3>
</div>
<input type="password" id="adminPasswordInput" placeholder="Enter admin password..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-pink-500">
<p id="adminPasswordError" class="text-xs text-red-400 text-center hidden">ভুল পাসওয়ার্ড!</p>
<div class="flex gap-2">
<button onclick="closeAdminPasswordModal()" class="flex-1 py-2.5 rounded-xl glass-card text-xs text-slate-300 font-semibold">Cancel</button>
<button onclick="verifyAdminPassword()" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-pink-600 to-purple-600 text-white text-xs font-bold"><i class="fa-solid fa-unlock mr-1"></i> Unlock</button>
</div>
</div>
</div>

<div id="adminPanel" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[80] hidden overflow-y-auto p-4">
<div class="max-w-6xl mx-auto my-6" id="adminPanelContent"></div>
</div>

<script src="part2.js"></script>
<script src="part3.js"></script>
</body>
  </html>
